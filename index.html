<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="釣り手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f3d4c">
<title>釣り手帳</title>
<!-- ホーム画面に置いた時のアプリ設定とアイコン -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<!-- フォント（見出し：丸ゴシック／本文：Noto Sans JP） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<!-- 地図ライブラリ Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
/* ===== 色と文字のルール（デザインの土台） =====
   レイアウト：上に帯、下にタブバー。スマホ片手で操作できる1カラム。 */
:root{
  --bg:#eef3f2; --card:#ffffff; --ink:#142a30; --muted:#566d73; --line:#d3dfdf;
  --band:#0f3d4c; --band-ink:#f2f7f6; --sea:#1d6278; --sea-soft:#d9e9ec; --sea-mid:#9ccad6;
  --float:#d9482a; --float-ink:#ffffff; --ok:#2b7d55; --warn:#a86d00; --warn-bg:#fff2d6;
  --f-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1a1f; --card:#12262c; --ink:#e4eeee; --muted:#93a9ad; --line:#23404a;
    --band:#0d2e38; --band-ink:#e4eeee; --sea:#7cc3d6; --sea-soft:#173a45; --sea-mid:#2d6575;
    --float:#ff7a52; --float-ink:#1a0d08; --ok:#6fd0a0; --warn:#ffc35c; --warn-bg:#3a2c10;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.3}
:focus-visible{outline:3px solid var(--float);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 上の帯 */
.top{background:var(--band);color:var(--band-ink);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-size:1.5rem;font-weight:900;letter-spacing:.04em}
.top .today{font-size:.9rem;opacity:.85}

main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-width:720px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:16px}

/* 下のタブバー */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.tabbar button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.8rem;color:var(--muted);border-radius:10px;cursor:pointer}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-current="page"]{color:var(--sea);font-weight:700;background:var(--sea-soft)}

/* 共通パーツ */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:1.15rem;margin-bottom:10px}
.label{font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--float);color:var(--float-ink);border-color:var(--float);font-weight:700}
.btn.sea{background:var(--sea);color:var(--card);border-color:var(--sea);font-weight:700}
.btn.danger{color:var(--float);border-color:var(--float)}
.btn.block{width:100%}
.big-add{font-size:1.15rem;padding:16px;border-radius:14px}
select,input,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:46px}
textarea{min-height:80px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:.85rem;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-block;font-size:.78rem;padding:1px 8px;border-radius:99px;background:var(--sea-soft);color:var(--sea);font-weight:700;white-space:nowrap}
.chip.big{background:var(--float);color:var(--float-ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sea-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;cursor:pointer;color:var(--sea);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;font-size:.95rem}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:1.1rem;margin-bottom:6px}

/* 今日の海 */
.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.sum .wx{font-size:3rem;line-height:1;grid-row:span 2}
.sum .wx-label{font-family:var(--f-head);font-size:1.4rem;font-weight:700}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.fact{background:var(--bg);border-radius:10px;padding:8px 12px}
.fact b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.tide-name{font-family:var(--f-head);font-size:1.6rem;font-weight:900;color:var(--sea)}
.hours{overflow-x:auto;display:flex;gap:6px;padding-bottom:6px;scroll-snap-type:x proximity}
.hour{flex:0 0 64px;background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;scroll-snap-align:start;font-variant-numeric:tabular-nums}
.hour .t{font-size:.8rem;color:var(--muted);font-weight:700}
.hour .i{font-size:1.5rem;line-height:1.3}
.hour .rain{font-size:.78rem;color:var(--sea)}
.hour .wind{font-size:.78rem}
.hour .arrow{display:inline-block}
.hour.strong .wind{color:var(--float);font-weight:700}
.tide-svg{width:100%;height:auto;display:block}
.extremes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ext{background:var(--bg);border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums}
.ext b{font-family:var(--f-head)}
.src{font-size:.75rem;color:var(--muted)}

/* 釣果帳 */
.list{display:flex;flex-direction:column;gap:10px}
.catch{display:grid;grid-template-columns:84px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;width:100%}
.thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;background:var(--sea-soft);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-head);font-size:1.6rem;color:var(--sea);font-weight:900;overflow:hidden}
.catch .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.catch .fish{font-family:var(--f-head);font-size:1.2rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 釣果入力：魚の行（種類・大きさ・匹数・消す） */
.fish-rows{display:flex;flex-direction:column;gap:8px}
.fish-row{display:grid;grid-template-columns:minmax(0,1fr) 4.6em 3.8em 40px;gap:6px;align-items:center}
.fish-row input{padding:10px 8px}
.fish-head{font-size:.78rem;color:var(--muted);font-weight:700}
.photo-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.photo-strip .ph{position:relative;flex:none;width:72px;height:72px;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--bg);cursor:pointer}
.photo-strip .ph img{width:100%;height:100%;object-fit:cover}
#cd-strip .ph[aria-pressed="true"]{border-color:var(--sea)}
.ph-x{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font-size:2rem;font-weight:700}
#cf-photos .ph[aria-pressed="true"] .ph-x{display:flex}
.fr-del{border:0;background:var(--bg);border-radius:50%;width:40px;height:40px;font-size:1.1rem;cursor:pointer;color:var(--muted)}
.catch .meta{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.month-h{font-family:var(--f-head);color:var(--muted);font-size:.95rem;margin-top:6px}

/* 地図 */
.map-wrap{position:relative;z-index:0}   /* 地図のボタンが上に重なる画面（シート）を突き抜けないように */
#map{height:min(62vh,560px);min-height:340px;border-radius:14px;border:1px solid var(--line);z-index:0}
.bobber{width:26px;height:26px;border-radius:50%;background:linear-gradient(var(--float) 50%,#fff 50%);border:2px solid #222;box-shadow:0 2px 4px rgba(0,0,0,.35)}
/* 釣り場の目印：ウキ＋名前の札（地図の上なので、テーマに関係なく白い札で読みやすく） */
.pin{position:relative;width:30px;height:30px}
.pin .bobber{width:30px;height:30px}
.pin-label{position:absolute;left:34px;top:3px;white-space:nowrap;background:#fff;color:#142a30;border:1px solid #9fb5b9;border-radius:6px;
  padding:1px 7px;font:700 14px/1.5 var(--f-body);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tiles-pale{filter:saturate(.45) brightness(1.03)}   /* 道路などの色を抑えて、海岸線と釣り場の目印を目立たせる */
.here-dot{width:18px;height:18px;border-radius:50%;background:#2a7fff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(42,127,255,.25)}
.leaflet-touch .leaflet-bar a{width:46px;height:46px;line-height:46px;font-size:24px}
.map-btns{position:absolute;right:10px;top:10px;z-index:600;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.mbtn{background:#fff;color:#142a30;border:1px solid #9fb5b9;border-radius:10px;padding:9px 12px;font-weight:700;font-size:.95rem;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.crosshair{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;z-index:500;pointer-events:none}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:#e0301e;box-shadow:0 0 0 2px #fff}
.crosshair::before{left:50%;top:0;bottom:0;width:4px;margin-left:-2px}
.crosshair::after{top:50%;left:0;right:0;height:4px;margin-top:-2px}
.add-bar{background:var(--card);border:2px solid var(--float);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.add-bar p{margin:0}
#map-results button{text-align:left}
#cf-map{height:240px;border-radius:12px;border:1px solid var(--line);z-index:0}
#cf-where{margin-bottom:4px}
/* 釣り場の情報：月ボタンと「釣れる魚カレンダー」 */
.form-h{font-size:1.05rem;margin-top:6px}
.season-row{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.mchip{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px 0;font-size:.8rem;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--muted)}
.mchip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--card);font-weight:700}
.travel{color:var(--sea);font-weight:700}
.sd-go{display:flex;flex-direction:column;gap:8px}
.sd-sec{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.sd-sec h3{font-size:1.05rem}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.cal-wrap{overflow-x:auto}
.cal{border-collapse:separate;border-spacing:2px;width:100%;font-size:.78rem;font-variant-numeric:tabular-nums}
.cal th{font-weight:700;color:var(--muted);padding:2px}
.cal tbody th{text-align:left;color:var(--ink);white-space:nowrap;padding-right:6px;font-size:.85rem}
.cal td{height:26px;min-width:20px;text-align:center;background:var(--bg);border-radius:5px;font-weight:700}
.cal td.exp{background:var(--sea-mid)}
.cal td.hit{background:var(--sea);color:var(--card)}
.cal .now{outline:2px solid var(--float);outline-offset:-2px}
.cal thead th.now{outline:none;color:var(--float)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.lg-hit{background:var(--sea)} .lg-exp{background:var(--sea-mid);margin-left:4px}

/* ホーム画面に追加の案内 */
.install-hint{max-width:720px;margin:12px auto 0;background:var(--card);border:2px solid var(--sea);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;
  margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:752px){ .install-hint{margin-left:auto;margin-right:auto} }
.ih-body{display:flex;gap:12px;align-items:flex-start}
.ih-body img{border-radius:12px;flex:none}
.ih-body p{margin:4px 0 0;font-size:.95rem}
.ih-share{width:20px;height:20px;vertical-align:-4px;color:var(--sea)}

/* ログイン画面 */
body.signed-out main, body.signed-out .tabbar{display:none}
#auth{max-width:480px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
#auth .lead{margin:0;color:var(--muted)}
.err{color:var(--float);font-weight:700;font-size:.95rem;margin:0}
.ok-msg{color:var(--ok);font-weight:700;font-size:.95rem;margin:0}
.linkbtn{background:none;border:0;color:var(--sea);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:.95rem;align-self:flex-start}
.spot{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;width:100%;text-align:left}
.spot b{font-family:var(--f-head);font-size:1.1rem}

/* 成績 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.tile b{display:block;font-family:var(--f-head);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile small{color:var(--muted);font-size:.78rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:6.5em 1fr auto;gap:8px;align-items:center;font-size:.95rem}
.bar-k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;background:var(--sea-soft);border-radius:99px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--sea);border-radius:99px}
.bar-v{font-variant-numeric:tabular-nums;font-weight:700;min-width:3.5em;text-align:right}

/* 下から出るシート */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(5,20,25,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet-body{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h2{font-size:1.3rem}
.x{border:0;background:var(--bg);border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer}
.photo-big{width:100%;border-radius:12px;max-height:50vh;object-fit:contain;background:var(--bg)}
.dl{display:grid;grid-template-columns:6em 1fr;gap:6px 12px}
.dl dt{color:var(--muted);font-size:.9rem}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:.95rem}

[hidden]{display:none!important}
@media (max-width:340px){ .tiles{grid-template-columns:1fr} .grid2{grid-template-columns:1fr} }
@media (max-width:400px){ .tile b{font-size:1.35rem} }
@media (prefers-reduced-motion:no-preference){ .bar-fill{transition:width .4s ease} }
</style>
</head>
<body>

<header class="top">
  <h1>釣り手帳</h1>
  <span class="today num" id="today"></span>
</header>

<!-- ===== 「ホーム画面に追加」の案内（ブラウザで開いている時だけ出す） ===== -->
<div id="install-hint" class="install-hint" hidden>
  <div class="ih-body">
    <img src="icons/icon-192.png" alt="" width="52" height="52">
    <div>
      <b>アプリとしてホーム画面に置けます</b>
      <p id="ih-ios" hidden>画面下の <svg class="ih-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="共有"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>（共有）→「<b>ホーム画面に追加</b>」→「追加」の順に押してください。次からはアイコンを押すだけで開けます。</p>
      <p id="ih-android" hidden>下のボタンを押すと、ホーム画面にアイコンが追加されます。</p>
    </div>
  </div>
  <div class="row" style="justify-content:flex-end">
    <button class="btn" id="ih-close" type="button">閉じる</button>
    <button class="btn sea" id="ih-install" type="button" hidden>ホーム画面に追加</button>
  </div>
</div>

<!-- ===== ログイン・新規登録（ログイン機能が設定されている時だけ使う） ===== -->
<section id="auth" hidden></section>

<main>
  <!-- ===== 今日の海（天気・潮） ===== -->
  <section class="view" id="v-umi">
    <div class="row">
      <select id="umi-place" aria-label="場所" style="flex:1;min-width:0"></select>
      <button class="btn" id="btn-here" type="button">現在地</button>
    </div>
    <div class="seg" id="umi-days" role="group" aria-label="日付"></div>
    <div id="umi-body" class="view"><div class="card muted">読み込み中…</div></div>
  </section>

  <!-- ===== 釣果帳 ===== -->
  <section class="view" id="v-log" hidden>
    <button class="btn primary big-add" id="add-catch" type="button">＋ 釣果を記録する</button>
    <div id="migrate-banner" class="notice" hidden>
      <span id="migrate-text"></span>
      <div class="row" style="margin-top:8px"><button class="btn sea" id="migrate-go" type="button">アカウントに移す</button></div>
    </div>
    <input id="log-q" type="search" placeholder="魚の名前・場所で絞り込み" aria-label="絞り込み">
    <div id="log-list" class="list"></div>
  </section>

  <!-- ===== 釣り場マップ ===== -->
  <section class="view" id="v-map" hidden>
    <form class="row" id="map-search">
      <input id="map-q" type="search" placeholder="地名で探す（例：城ヶ島）" aria-label="地名で探す" style="flex:1;min-width:0">
      <button class="btn sea" type="submit">探す</button>

<script type="module">
// ログイン機能の設定（未設定なら null）
import FIREBASE_CONFIG from './firebase-config.js';

/* =========================================================
   0. 小さな道具
   ========================================================= */
const $ = s => document.querySelector(s);
// 入力された文字をそのまま画面に出すと危ないので、記号を無害化する
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
function nowLocal(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function fmtDate(s){ const [y,m,d] = s.slice(0,10).split('-').map(Number); const w = '日月火水木金土'[new Date(y,m-1,d).getDay()]; return `${m}/${d}(${w})`; }
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

/* =========================================================
   1. データ保存
   ・ログイン機能が設定済み（firebase-config.js に設定あり）
       → Firebase（Google のクラウド）にアカウントごとに保存。機種変更しても、別の端末でも同じ記録が見られる
       → 電波が無い所で記録しても、スマホに一時保存され、電波が戻ると自動で送られる
   ・未設定 → このスマホの中（IndexedDB）だけに保存
   記録の形：catches = 釣果、spots = 釣り場、photos = 写真（大きいので別に保存。一覧には小さな thumb を使う）
   ========================================================= */
let catches = [], spots = [];
let S = null;          // いま使っている保存先（localStore か cloudStore）
let fb = null, user = null;
const spotById = id => spots.find(s => s.id === id);

/* ---- 写真を縮める：一覧用の小さい画像（thumb）と、詳細用の画像（full）を作る ---- */
async function resizeToDataUrl(src, maxSide, quality){
  const img = await createImageBitmap(src);
  const s = Math.min(1, maxSide / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}
async function makePhoto(file){
  let full = await resizeToDataUrl(file, 1280, 0.78);
  if (full.length > 900000) full = await resizeToDataUrl(file, 960, 0.68);   // クラウドの1件あたりの上限（約1MB）に収める
  return {full, thumb: await resizeToDataUrl(file, 240, 0.7)};
}

/* ---- スマホの中に保存（IndexedDB）---- */
let dbp;
function idb(){
  return dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('tsuri-techo', 2);
    r.onupgradeneeded = () => { const d = r.result; for (const n of ['catches','spots','photos']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath:'id'}); };
    // 新しい版のアプリが別のタブで開かれた時は接続を譲る（古いタブが保存を止めてしまわないように）
    r.onsuccess = () => { r.result.onversionchange = () => { r.result.close(); dbp = null; }; res(r.result); };
    r.onerror = () => rej(r.error);
  });
}
async function dbAll(store){ const d = await idb(); return new Promise((res, rej) => { const q = d.transaction(store).objectStore(store).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function dbGet(store, id){ const d = await idb(); return new Promise((res, rej) => { const q = d.transaction(store).objectStore(store).get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function dbTx(store, fn){ const d = await idb(); return new Promise((res, rej) => { const tx = d.transaction(store, 'readwrite'); fn(tx.objectStore(store)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }

const localStore = {
  mode: 'local',
  // 読み込み。ついでに、前の版で入れた見本データを消し、古い形式の写真を新しい形式に直す
  async load(){
    let [cs, ss] = await Promise.all([dbAll('catches'), dbAll('spots')]);
    for (const c of cs.filter(c => c.sample)) await dbTx('catches', st => st.delete(c.id));
    for (const s of ss.filter(s => s.sample)) await dbTx('spots', st => st.delete(s.id));
    cs = cs.filter(c => !c.sample); ss = ss.filter(s => !s.sample);
    for (const c of cs){
      if (!(c.photo instanceof Blob)) continue;
      try { const p = await makePhoto(c.photo); await dbTx('photos', st => st.put({id: c.id, data: p.full})); c.photos = [{id: c.id, thumb: p.thumb}]; c.thumb = p.thumb; c.hasPhoto = true; } catch {}
      delete c.photo; await dbTx('catches', st => st.put(c));
    }
    return {cs, ss};
  },
  async saveCatch(rec){ await dbTx('catches', st => st.put(rec)); await reloadLocal(); },
  async deleteCatch(id){
    const c = catches.find(x => x.id === id);
    await dbTx('catches', st => st.delete(id));
    for (const p of c ? photosOf(c) : [{id}]) await dbTx('photos', st => st.delete(p.id));
    await reloadLocal();
  },
  async putPhoto(id, data){ await dbTx('photos', st => st.put({id, data})); },
  async deletePhoto(id){ await dbTx('photos', st => st.delete(id)); },
  async saveSpot(rec){ await dbTx('spots', st => st.put(rec)); await reloadLocal(); },
  async deleteSpot(id){ await dbTx('spots', st => st.delete(id)); await reloadLocal(); },
  async getPhoto(id){ return (await dbGet('photos', id))?.data || null; },
  async clearAll(){ for (const n of ['catches','spots','photos']) await dbTx(n, st => st.clear()); },
};
async function reloadLocal(){ const {cs, ss} = await localStore.load(); catches = cs; spots = ss; onData(); }

/* ---- クラウドに保存（Firebase）---- */
async function initFirebase(){
  const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [appM, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app); auth.languageCode = 'ja';
  let db;
  // スマホにも記録を置いておく設定（電波が無くても見られる・書ける）
  try { db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
  catch { db = F.getFirestore(app); }
  fb = {auth, db, A, F};
}
const userCol = name => fb.F.collection(fb.db, 'users', user.uid, name);
const userDoc = (name, id) => fb.F.doc(fb.db, 'users', user.uid, name, id);
const plain = o => JSON.parse(JSON.stringify(o));   // クラウドに送れない値（undefined など）を取り除く
const sent = p => p.catch(e => { console.error(e); toast('保存できませんでした。通信状態を確かめて、もう一度お試しください'); });
let unsubs = [];
function listenCloud(){
  unsubs.forEach(u => u()); unsubs = [];
  const fail = e => { console.error(e); toast('記録を読み込めませんでした'); };
  // onSnapshot：クラウドの記録が変わるたびに自動で呼ばれる（別の端末で記録しても反映される）
  unsubs.push(fb.F.onSnapshot(userCol('catches'), snap => { catches = snap.docs.map(d => d.data()); onData(); }, fail));
  unsubs.push(fb.F.onSnapshot(userCol('spots'), snap => { spots = snap.docs.map(d => d.data()); onData(); }, fail));
}
const cloudStore = {
  mode: 'cloud',
  // 書き込みは待たずに進める（電波が無くても画面はすぐ更新され、送信は後で自動で行われる）
  async saveCatch(rec){ sent(fb.F.setDoc(userDoc('catches', rec.id), plain(rec))); },
  async deleteCatch(id){
    const c = catches.find(x => x.id === id);
    sent(fb.F.deleteDoc(userDoc('catches', id)));
    for (const p of c ? photosOf(c) : [{id}]) sent(fb.F.deleteDoc(userDoc('photos', p.id)));
  },
  async putPhoto(id, data){ sent(fb.F.setDoc(userDoc('photos', id), {id, data})); },
  async deletePhoto(id){ sent(fb.F.deleteDoc(userDoc('photos', id))); },
  async saveSpot(rec){ sent(fb.F.setDoc(userDoc('spots', rec.id), plain(rec))); },
  async deleteSpot(id){ sent(fb.F.deleteDoc(userDoc('spots', id))); },
  async getPhoto(id){ try { const s = await fb.F.getDoc(userDoc('photos', id)); return s.exists() ? s.data().data : null; } catch { return null; } },
};

/* ---- 写真（1件の釣果に最大5枚）----
   c.photos = [{id, thumb}]：thumb は一覧用の小さい画像、大きい画像は photos に id ごとに保存
   前の形式（写真1枚：hasPhoto / thumb、写真の id は釣果の id と同じ）も同じ形で扱う */
const MAX_PHOTOS = 5;
const photosOf = c => Array.isArray(c.photos) ? c.photos : (c.hasPhoto ? [{id: c.id, thumb: c.thumb}] : []);
async function saveCatchWithPhotos(rec, add = [], removeIds = []){
  const keep = photosOf(rec).filter(p => !removeIds.includes(p.id));
  for (const id of removeIds) await S.deletePhoto(id);
  for (const p of add.slice(0, Math.max(0, MAX_PHOTOS - keep.length))){
    const id = `${rec.id}_${uid()}`; await S.putPhoto(id, p.full); keep.push({id, thumb: p.thumb});
  }
  rec.photos = keep; rec.thumb = keep[0]?.thumb || null; rec.hasPhoto = keep.length > 0;
  await S.saveCatch(rec);
}

/* 記録が変わったら、いま開いている画面を描き直す */
function onData(){
  catches.forEach(c => c.tide = tideInfo(c.at).name);   // 潮回りはいつも最新の計算方法で付け直す
  if (currentTab === 'log') renderLog();
  else if (currentTab === 'map') renderMap();
  else if (currentTab === 'stats') renderStats();
  else renderPlaceSelect();
}

/* =========================================================
   2. 潮回り（大潮・中潮…）を「本当の新月の時刻」から計算
   天文計算（Meeus『天文アルゴリズム』の新月の式）で新月の時刻を分単位で求め、
   新月の日を旧暦1日として「旧暦で何日目か」を出し、潮の名前を決める
   ========================================================= */
const RAD = Math.PI / 180, sinD = d => Math.sin(d * RAD);
function newMoonMs(k){   // k番目の新月（k=0 が2000年1月の新月）の時刻（ミリ秒）
  const T = k / 1236.85;
  let jde = 2451550.09766 + 29.530588861*k + 0.00015437*T*T - 0.00000015*T**3 + 0.00000000073*T**4;
  const E = 1 - 0.002516*T - 0.0000074*T*T;
  const M  = 2.5534 + 29.1053567*k - 0.0000014*T*T - 0.00000011*T**3;                         // 太陽の平均近点角
  const Mp = 201.5643 + 385.81693528*k + 0.0107582*T*T + 0.00001238*T**3 - 0.000000058*T**4;  // 月の平均近点角
  const F  = 160.7108 + 390.67050284*k - 0.0016118*T*T - 0.00000227*T**3 + 0.000000011*T**4;  // 月の緯度引数
  const O  = 124.7746 - 1.56375588*k + 0.0020672*T*T + 0.00000215*T**3;                        // 昇交点の経度
  // 月の軌道のゆらぎによる補正（平均の新月から最大で十数時間ずれる）
  jde += -0.4072*sinD(Mp) + 0.17241*E*sinD(M) + 0.01608*sinD(2*Mp) + 0.01039*sinD(2*F) + 0.00739*E*sinD(Mp-M)
    - 0.00514*E*sinD(Mp+M) + 0.00208*E*E*sinD(2*M) - 0.00111*sinD(Mp-2*F) - 0.00057*sinD(Mp+2*F) + 0.00056*E*sinD(2*Mp+M)
    - 0.00042*sinD(3*Mp) + 0.00042*E*sinD(M+2*F) + 0.00038*E*sinD(M-2*F) - 0.00024*E*sinD(2*Mp-M) - 0.00017*sinD(O)
    - 0.00007*sinD(Mp+2*M) + 0.00004*sinD(2*Mp-2*F) + 0.00004*sinD(3*M) + 0.00003*sinD(Mp+M-2*F) + 0.00003*sinD(2*Mp+2*F)
    - 0.00003*sinD(Mp+M+2*F) + 0.00003*sinD(Mp-M+2*F) - 0.00002*sinD(Mp-M-2*F) - 0.00002*sinD(3*Mp+M) + 0.00002*sinD(4*Mp);
  jde -= 69 / 86400;   // 地球の自転のずれ（ΔT 約69秒）を差し引く
  return (jde - 2440587.5) * 864e5;
}
const jstDay = ms => Math.floor((ms + 9*3600e3) / 864e5);   // 日本時間で何日目か（通し番号）
const TIDE_BY_DAY = ['','大潮','大潮','中潮','中潮','中潮','中潮','小潮','小潮','小潮','長潮','若潮','中潮','中潮','大潮','大潮','大潮','大潮','中潮','中潮','中潮','中潮','小潮','小潮','小潮','長潮','若潮','中潮','中潮','中潮','大潮'];
const tideMemo = {};
function tideInfo(dateStr){
  const ds = dateStr.slice(0,10);
  if (tideMemo[ds]) return tideMemo[ds];
  const noon = Date.parse(ds + 'T12:00:00+09:00'), day = jstDay(noon);
  let k = Math.floor((noon - Date.UTC(2000,0,6)) / (29.530588861 * 864e5));
  while (jstDay(newMoonMs(k)) > day) k--;
  while (jstDay(newMoonMs(k + 1)) <= day) k++;
  const lunarDay = Math.min(30, day - jstDay(newMoonMs(k)) + 1);   // 旧暦の日付
  return tideMemo[ds] = {name: TIDE_BY_DAY[lunarDay], age: (noon - newMoonMs(k)) / 864e5, lunarDay};
}
const TIDE_ORDER = ['大潮','中潮','小潮','長潮','若潮'];

/* =========================================================
   3. タブ切り替え
   ========================================================= */
let currentTab = 'umi', map;
function showTab(tab){
  currentTab = tab;
  for (const v of ['umi','log','map','stats']) $('#v-'+v).hidden = v !== tab;
  document.querySelectorAll('.tabbar button').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if (tab === 'umi') renderUmi();
  if (tab === 'log') renderLog();
  if (tab === 'map'){ renderMap(); autoTravel(); }
  if (tab === 'stats') renderStats();
  window.scrollTo(0,0);
}
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

/* =========================================================
   4. 下から出るシート（入力フォームや詳細表示）
   ========================================================= */
let miniMap = null;   // 釣果入力の中の小さな地図（シートを開き直すたびに作り直す）
function openSheet(html, mount){ if (miniMap){ miniMap.remove(); miniMap = null; } const b = $('#sheet-body'); b.innerHTML = html; $('#sheet').hidden = false; document.body.classList.add('locked'); b.scrollTop = 0; mount && mount(b); }
function closeSheet(){ $('#sheet').hidden = true; document.body.classList.remove('locked'); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet' || e.target.closest('[data-close]')) closeSheet(); });
const sheetHead = t => `<div class="sheet-head"><h2>${esc(t)}</h2><button class="x" data-close type="button" aria-label="閉じる">×</button></div>`;

/* =========================================================
   5. 今日の海：天気と潮位を Open-Meteo（無料の気象API）から取得
   ========================================================= */
const DEFAULT_PLACE = {id:'default', name:'東京湾（横浜）', lat:35.45, lng:139.65};
const umi = {placeId: lsGet('placeId') || 'default', day: 0, here: null};
const fcCache = {};

function places(){
  const p = spots.map(s => ({id:s.id, name:s.name, lat:s.lat, lng:s.lng}));
  if (umi.here) p.unshift(umi.here);
  p.push(DEFAULT_PLACE);
  return p;
}
function currentPlace(){ const p = places(); return p.find(x => x.id === umi.placeId) || p[0]; }

// 天気コード → 日本語とマーク
function wx(code){
  if (code == null) return ['—','·'];
  if (code === 0) return ['快晴','☀'];
  if (code === 1) return ['晴れ','☀'];
  if (code === 2) return ['晴れ時々くもり','⛅'];
  if (code === 3) return ['くもり','☁'];
  if (code <= 48) return ['霧','≋'];
  if (code <= 57) return ['霧雨','☂'];
  if (code <= 67) return ['雨','☂'];
  if (code <= 77) return ['雪','❄'];
  if (code <= 82) return ['にわか雨','☂'];
  if (code <= 86) return ['にわか雪','❄'];
  return ['雷雨','⚡'];
}
const DIRS = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
const dirName = deg => DIRS[Math.round(deg / 22.5) % 16];

async function getForecast(p){
  const key = p.lat.toFixed(3) + ',' + p.lng.toFixed(3);
  const c = fcCache[key]; if (c && Date.now() - c.t < 30*60e3) return c;
  const q = `latitude=${p.lat}&longitude=${p.lng}&timezone=Asia%2FTokyo&forecast_days=3`;
  // models=jma_seamless：気象庁の予報モデル（2日先までは5km間隔の MSM、その先は全球モデル）に固定
  const wUrl = `https://api.open-meteo.com/v1/forecast?${q}&models=jma_seamless&wind_speed_unit=ms&hourly=temperature_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_sum,wind_speed_10m_max`;
  // 海の情報（波の高さ・海水温、潮位表が使えない時の潮位）
  const mUrl = `https://marine-api.open-meteo.com/v1/marine?${q}&hourly=sea_level_height_msl,wave_height,sea_surface_temperature`;
  const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const [w, m] = await Promise.allSettled([get(wUrl), get(mUrl)]);
  if (w.status !== 'fulfilled') throw new Error('weather');
  const out = {t: Date.now(), w: w.value, m: m.status === 'fulfilled' ? m.value : null};
  fcCache[key] = out; return out;
}

/* ---------- 気象庁の潮位表（港ごとの天文潮位の予測）----------
   tide/stations.json … 全国の潮位表地点（名前・緯度経度）
   tide/2026/TK.txt など … 気象庁が公開している年間の潮位表（1日1行の固定長テキスト）
     1〜72文字目：0時〜23時の潮位（3文字ずつ、cm）
     73〜78：年月日　79〜80：地点記号
     81〜108：満潮（時刻4文字＋潮位3文字）×4回　109〜136：干潮 ×4回（9999 は「なし」） */
let stationsP;
const loadStations = () => stationsP ||= fetch('tide/stations.json').then(r => r.json()).catch(() => []);
function distKm(a, b){ const dLat = (b.lat-a.lat)*RAD, dLng = (b.lng-a.lng)*RAD;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLng/2)**2; return 12742 * Math.asin(Math.sqrt(h)); }
async function nearestStation(p){
  const st = await loadStations(); let best = null;
  for (const s of st){ const d = distKm(p, s); if (!best || d < best.d) best = {...s, d}; }
  return best;
}
const tideYear = {};
function loadTideYear(code, year){
  const key = code + year;
  return tideYear[key] ||= fetch(`tide/${year}/${code}.txt`).then(r => { if (!r.ok) throw 0; return r.text(); }).then(txt => {
    const days = {};
    for (const line of txt.split('\n')){
      if (line.length < 136) continue;
      const hourly = []; for (let i = 0; i < 24; i++) hourly.push(+line.slice(i*3, i*3+3));
      const y = 2000 + +line.slice(72,74), m = +line.slice(74,76), d = +line.slice(76,78);
      const ext = (from, type) => { const out = []; for (let i = 0; i < 4; i++){ const t = line.slice(from + i*7, from + i*7 + 4); if (t.trim() === '9999') continue;
        const hh = +t.slice(0,2), mm = +t.slice(2,4); out.push({type, hm: `${pad(hh)}:${pad(mm)}`, hour: hh + mm/60, v: +line.slice(from + i*7 + 4, from + i*7 + 7)}); } return out; };
      days[`${y}-${pad(m)}-${pad(d)}`] = {hourly, ext: [...ext(80,'満潮'), ...ext(108,'干潮')].sort((a,b) => a.hour - b.hour)};
    }
    return days;
  }).catch(() => { delete tideYear[key]; return null; });
}
async function tideTableDay(code, dayStr){
  const next = new Date(Date.parse(dayStr + 'T00:00:00Z') + 864e5).toISOString().slice(0,10);
  const [a, b] = await Promise.all([loadTideYear(code, dayStr.slice(0,4)), loadTideYear(code, next.slice(0,4))]);
  const today = a?.[dayStr]; if (!today) return null;
  return {...today, next0: b?.[next]?.hourly[0]};
}

// 1時間ごとの潮位から「満潮」「干潮」の時刻を見つける（前後と比べて山・谷になっている所）
function findExtremes(times, h){
  const base = Date.parse(times[0] + ':00Z'), out = [];
  for (let i = 1; i < h.length - 1; i++){
    const a = h[i-1], b = h[i], c = h[i+1];
    if (a == null || b == null || c == null) continue;
    const high = b > a && b >= c, low = b < a && b <= c;
    if (!high && !low) continue;
    const den = a - 2*b + c; const off = den ? 0.5 * (a - c) / den : 0;   // 山の頂点をなめらかに推定
    const val = b - 0.25 * (a - c) * off;
    const d = new Date(base + (i + off) * 3600e3);
    out.push({type: high ? '満潮' : '干潮', date: d.toISOString().slice(0,10), hm: d.toISOString().slice(11,16), hour: d.getUTCHours() + d.getUTCMinutes()/60, v: val});
  }
  return out;
}

// Open-Meteo の時系列から、その日の [時, 潮位] の組を取り出す（潮位表が使えない時の予備）
function modelPts(times, h, dayStr){
  const pts = [];
  times.forEach((t, i) => { if (t.startsWith(dayStr) && h[i] != null) pts.push([+t.slice(11,13), h[i]]); });
  const ni = times.findIndex(t => t > dayStr + 'T23:00');
  if (ni >= 0 && h[ni] != null) pts.push([24, h[ni]]);
  return pts;
}

function tideSvg(pts, ext, isToday, unit){
  if (pts.length < 6) return '';
  const fmtV = v => unit === 'cm' ? `${Math.round(v)}cm` : `${v.toFixed(1)}m`;
  const W = 340, H = 150, pl = 40, pr = 10, pt = 22, pb = 24;
  let mn = Math.min(...pts.map(p => p[1])), mx = Math.max(...pts.map(p => p[1]));
  const padV = (mx - mn) * 0.15 || 0.1; mn -= padV; mx += padV;
  const x = hr => pl + hr / 24 * (W - pl - pr), y = v => pt + (mx - v) / (mx - mn) * (H - pt - pb);
  // なめらかな曲線（Catmull-Rom）
  let d = `M${x(pts[0][0])},${y(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    d += ` C${x(p1[0] + (p2[0]-p0[0])/6)},${y(p1[1] + (p2[1]-p0[1])/6)} ${x(p2[0] - (p3[0]-p1[0])/6)},${y(p2[1] - (p3[1]-p1[1])/6)} ${x(p2[0])},${y(p2[1])}`;
  }
  const area = `${d} L${x(pts[pts.length-1][0])},${H-pb} L${x(pts[0][0])},${H-pb} Z`;
  let g = '';
  for (const hr of [0,6,12,18,24]) g += `<line x1="${x(hr)}" x2="${x(hr)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)"/><text x="${x(hr)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${hr}時</text>`;
  g += `<text x="${pl-6}" y="${y(mx - padV)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtV(mx-padV)}</text>`;
  g += `<text x="${pl-6}" y="${y(mn + padV)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtV(mn+padV)}</text>`;
  let marks = '';
  for (const e of ext){
    const cx = x(e.hour), cy = y(e.v), up = e.type === '満潮';
    marks += `<circle cx="${cx}" cy="${cy}" r="4.5" fill="${up ? 'var(--sea)' : 'var(--card)'}" stroke="var(--sea)" stroke-width="2"/>`;
    marks += `<text x="${Math.min(W-pr-14, Math.max(pl+14, cx))}" y="${up ? cy - 9 : cy + 17}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${e.hm}</text>`;
  }
  if (isToday){ const n = new Date(); const hr = n.getHours() + n.getMinutes()/60; marks += `<line x1="${x(hr)}" x2="${x(hr)}" y1="${pt-8}" y2="${H-pb}" stroke="var(--float)" stroke-width="2" stroke-dasharray="3 3"/><text x="${x(hr)}" y="${pt-11}" text-anchor="middle" font-size="10" fill="var(--float)" font-weight="700">いま</text>`; }
  return `<svg class="tide-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="潮位グラフ">${g}<path d="${area}" fill="var(--sea-soft)"/><path d="${d}" fill="none" stroke="var(--sea)" stroke-width="2.5"/>${marks}</svg>`;
}

}

  });

  // 潮位：まず気象庁の潮位表（一番近い港）、無ければ Open-Meteo の数値モデル
  let tideHtml = `<p class="muted small" style="margin:0">この地点の潮位データはありません（陸の上の地点だと出ません。海沿いの釣り場を選んでください）。</p>`;
  let sst = '', wave = '';
  const M = fc.m;
  const extList = ext => `<div class="extremes">${ext.map(e => `<span class="ext"><b>${e.type}</b> ${e.hm}${e.cm != null ? ` <span class="small muted">${e.cm}cm</span>` : ''}</span>`).join('') || '<span class="muted small">満潮・干潮の時刻を計算できませんでした</span>'}</div>`;
  const stn = await nearestStation(p);
  const tt = stn && stn.d <= 60 ? await tideTableDay(stn.code, dayStr) : null;

  if (tt){
    // 毎時の値に満潮・干潮の時刻の値も混ぜると、山と谷がずれずに描ける
    const pts = tt.hourly.map((v, h) => [h, v]); if (tt.next0 != null) pts.push([24, tt.next0]);
    for (const e of tt.ext) pts.push([e.hour, e.v]);

    tideHtml = tideSvg(pts, tt.ext, umi.day === 0, 'cm') + extList(tt.ext.map(e => ({...e, cm: e.v})))
      + `<p class="src" style="margin:8px 0 0">気象庁 潮位表「${esc(stn.name)}」（${p.id === 'default' ? 'この地点' : esc(p.name)}から約${stn.d.toFixed(0)}km）。潮位は潮位表基準面からの高さです。気圧や風による変化は含みません。</p>`;
  } else if (M && M.hourly && M.hourly.sea_level_height_msl && M.hourly.sea_level_height_msl.some(v => v != null)){
    const ext = findExtremes(M.hourly.time, M.hourly.sea_level_height_msl).filter(e => e.date === dayStr);
    tideHtml = tideSvg(modelPts(M.hourly.time, M.hourly.sea_level_height_msl, dayStr), ext, umi.day === 0, 'm') + extList(ext)
      + `<p class="src" style="margin:8px 0 0">近くに気象庁の潮位表の地点が無いため、数値モデル（Open-Meteo）の目安を表示しています。数十分ずれることがあります。</p>`;
  }
  if (M && M.hourly){
    const idx = M.hourly.time.map((t,i) => t.startsWith(dayStr) ? i : -1).filter(i => i >= 0);
    const ss = idx.map(i => M.hourly.sea_surface_temperature?.[i]).filter(v => v != null);
    const wv = idx.map(i => M.hourly.wave_height?.[i]).filter(v => v != null);
    if (ss.length) sst = (ss.reduce((a,b) => a+b, 0) / ss.length).toFixed(1);
    if (wv.length) wave = Math.max(...wv).toFixed(1);
  }

  const hm = s => s ? s.slice(11,16) : '—';
  body.innerHTML = `
    ${notes.map(n => `<div class="notice">${esc(n)}</div>`).join('')}
    <div class="card">
      <div class="sum">
        <div class="wx" aria-hidden="true">${wi}</div>
        <div class="wx-label">${wl}</div>
        <div class="num"><b style="color:var(--float)">${Math.round(W.daily.temperature_2m_max[di])}°</b> / <span class="muted">${Math.round(W.daily.temperature_2m_min[di])}°</span>　<span class="small muted">${esc(p.name)}</span></div>
      </div>

        <div class="fact"><span class="label">日の出 / 日の入</span><b>${hm(W.daily.sunrise[di])} / ${hm(W.daily.sunset[di])}</b></div>
        <div class="fact"><span class="label">最大風速</span><b>${windMax.toFixed(1)} m/s</b></div>
        <div class="fact"><span class="label">降水量（1日）</span><b>${rainSum != null ? rainSum.toFixed(1) : '—'} mm</b></div>
        ${sst ? `<div class="fact"><span class="label">海水温（平均）</span><b>${sst} ℃</b></div>` : ''}
        ${wave ? `<div class="fact"><span class="label">波の高さ（最大）</span><b>${wave} m</b></div>` : ''}
      </div>
    </div>
    <div class="card"><h2>潮の満ち引き</h2>${tideHtml}</div>
    <div class="card"><h2>1時間ごとの天気</h2><div class="hours" id="hours">${hours}</div><p class="small muted" style="margin:6px 0 0">矢印は風が吹いていく向き。赤字は風が強い時間（7m/s以上）。</p></div>
    <p class="src">天気：気象庁の予報モデル（Open-Meteo 経由、${new Date(fc.t).getHours()}時${pad(new Date(fc.t).getMinutes())}分に取得）。潮位：気象庁 潮位表。波の高さ・海水温：Open-Meteo の海洋モデル。潮回り：新月の時刻を天文計算し、旧暦の日付から求めています。</p>`;
  // 横スクロールを朝4時あたりから見せる
  const h4 = body.querySelector('.hour[data-h="4"]'); if (h4) $('#hours').scrollLeft = h4.offsetLeft - $('#hours').offsetLeft;

/* =========================================================
   6. 釣果帳
   1件の記録（＝1回の釣行・1つの場面）に、魚を何行でも入れられる
     fishes: [{fish:'アジ', size:30, count:1}, {fish:'アジ', size:20, count:10}, {fish:'サバ', size:null, count:3}]
   前の形式（魚1種類だけ：fish / size / count）の記録も、同じ形に直して扱う
   ========================================================= */
const fishesOf = c => Array.isArray(c.fishes) && c.fishes.length ? c.fishes : [{fish: c.fish || '', size: c.size ?? null, count: c.count || 1}];
const countOf = c => fishesOf(c).reduce((a, f) => a + (f.count || 1), 0);
const fishRows = cs => cs.flatMap(c => fishesOf(c).map(f => ({...f, count: f.count || 1, c})));   // 集計用：魚1行ずつに分解
const maxSizeOf = c => { const s = fishesOf(c).map(f => f.size).filter(v => v != null); return s.length ? Math.max(...s) : null; };
function fishSummary(c){   // 「アジ ×11・サバ ×3」のように魚の種類ごとにまとめた文字
  const m = new Map(); for (const f of fishesOf(c)) m.set(f.fish, (m.get(f.fish) || 0) + (f.count || 1));
  return [...m].map(([f, n]) => n > 1 ? `${f} ×${n}` : f).join('・');
}
/* 場所から「近くの登録済み釣り場」か「新しい釣り場の名前の候補」を出す
   ・300m以内に登録済みの釣り場があれば、同じ釣り場として扱う（同じ堤防が何個も登録されないように）
   ・なければ国土地理院の住所検索で「三浦市 三崎町城ヶ島」のような名前を作る（海の上なら近くの港の名前） */
let muniP;
const loadMuni = () => muniP ||= fetch('data/muni.json').then(r => r.json()).catch(() => ({}));
async function describePlace(lat, lng){
  const near = spots.map(s => ({s, d: distKm({lat, lng}, s)})).sort((a,b) => a.d - b.d)[0];
  if (near && near.d <= 0.3) return {near: near.s, dist: near.d};
  let name = '';
  try {
    const r = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lng}`);
    const res = (await r.json()).results || {};
    const muni = res.muniCd ? (await loadMuni())[String(parseInt(res.muniCd, 10))] || '' : '';
    const town = (res.lv01Nm || '').replace(/[－-]/g, '').trim();
    name = [muni, town].filter(Boolean).join(' ');
  } catch {}
  if (!name){ const st = await nearestStation({lat, lng}); if (st && st.d < 30) name = `${st.name}付近の海`; }
  return {suggest: name || '新しい釣り場'};
}

        <div id="cf-rows" class="fish-rows">${rows.map(fishRowHtml).join('')}</div>
        <button type="button" class="btn" id="cf-addrow">＋ 魚を追加</button>
        <p class="small muted" style="margin:0">大きさが違う魚は行を分けて入れられます（例：アジ 30cm ×1 と アジ 20cm ×10）。大きさを測っていなければ空のままでOK。</p>
      </div>
      <label class="field"><span>日時</span><input id="cf-at" type="datetime-local" required value="${esc(c.at)}"></label>
      <div class="field">
        <span>釣った場所</span>
        <div class="seg" id="cf-where" role="group" aria-label="場所の決め方">
          <button type="button" data-w="here">今いる場所</button>
          <button type="button" data-w="map">地図で選ぶ</button>
          <button type="button" data-w="list">登録済み</button>
        </div>
        <div id="cf-map-box" hidden><div class="map-wrap"><div id="cf-map"></div><div class="crosshair"></div></div>
          <p class="small muted" style="margin:4px 0 0">地図を動かして、赤い十字を釣った場所に合わせてください。</p></div>
        <select id="cf-spot" hidden>${spotOpts.replace('（場所を選ばない）', '（場所を記録しない）')}</select>
        <p id="cf-place-info" class="small" style="margin:0"></p>
        <label class="field" id="cf-name-wrap" hidden><span>新しい釣り場の名前（あとで直せます）</span><input id="cf-place-name"></label>
      </div>
      <label class="field"><span>釣り方・エサ</span><input id="cf-method" value="${esc(c.method)}" placeholder="例：サビキ／アミエビ"></label>
      <label class="field"><span>メモ</span><textarea id="cf-memo" placeholder="例：朝マヅメに群れが回ってきた">${esc(c.memo)}</textarea></label>
      <div class="field"><span>写真（${MAX_PHOTOS}枚まで）</span>
        ${photosOf(c).length ? `<div class="photo-strip" id="cf-photos">${photosOf(c).map(p => `<button type="button" class="ph" data-pid="${esc(p.id)}" aria-pressed="false" aria-label="この写真を消す印を付ける"><img src="${esc(p.thumb)}" alt=""><span class="ph-x">×</span></button>`).join('')}</div>
        <p class="small muted" style="margin:0">消したい写真は、押して × の印を付けてから保存してください。</p>` : ''}
        <input id="cf-photo" type="file" accept="image/*" multiple>
      </div>
      <button class="btn primary block" type="submit">保存する</button>
    </form>`, b => {
    // 魚の行の追加・削除（1行しかない時は消すボタンを隠す）
    const rowsBox = b.querySelector('#cf-rows');
    const syncDel = () => { const rs = rowsBox.querySelectorAll('.fish-row'); rs.forEach(r => r.querySelector('.fr-del').hidden = rs.length === 1); };
    syncDel();
    rowsBox.addEventListener('click', e => { if (e.target.closest('.fr-del')){ e.target.closest('.fish-row').remove(); syncDel(); } });
    b.querySelector('#cf-addrow').addEventListener('click', () => {
      const last = [...rowsBox.querySelectorAll('.fr-fish')].pop()?.value.trim() || '';
      rowsBox.insertAdjacentHTML('beforeend', fishRowHtml({fish: last, size: null, count: 1}));   // 直前と同じ魚の名前を入れておく
      syncDel();
      const r = rowsBox.lastElementChild; (last ? r.querySelector('.fr-size') : r.querySelector('.fr-fish')).focus();
    });
    // 今ある写真：押すと「消す」印が付く／外れる
    b.querySelectorAll('#cf-photos .ph').forEach(x => x.onclick = () => x.setAttribute('aria-pressed', x.getAttribute('aria-pressed') !== 'true'));
    // ---- 釣った場所：今いる場所 / 地図で選ぶ / 登録済みから ----
    const place = {mode: '', lat: null, lng: null, near: null, seq: 0};
    const info = b.querySelector('#cf-place-info'), nameWrap = b.querySelector('#cf-name-wrap'), nameIn = b.querySelector('#cf-place-name');
    const sel = b.querySelector('#cf-spot');
    async function resolvePlace(lat, lng){   // 位置が決まったら、近くの登録済み釣り場があるか・地名は何かを調べる
      const seq = ++place.seq; Object.assign(place, {lat, lng, near: null});
      nameWrap.hidden = true; info.textContent = '場所を調べています…';
      const d = await describePlace(lat, lng);
      if (seq !== place.seq) return;
      if (d.near){ place.near = d.near; info.textContent = `登録済みの釣り場「${d.near.name}」（約${Math.round(d.dist*1000)}m）として記録します。`; }
      else { info.textContent = 'ここは新しい釣り場として自動で登録されます。'; nameWrap.hidden = false; nameIn.value = d.suggest; }
    }
    function setWhere(mode){
      place.mode = mode; place.seq++;
      b.querySelectorAll('#cf-where button').forEach(x => x.setAttribute('aria-pressed', x.dataset.w === mode));
      b.querySelector('#cf-map-box').hidden = mode !== 'map'; sel.hidden = mode !== 'list'; nameWrap.hidden = true; info.textContent = '';
      if (mode === 'list'){ info.textContent = spots.length ? '' : 'まだ登録済みの釣り場がありません。「今いる場所」か「地図で選ぶ」を使ってください。'; return; }
      if (mode === 'here'){
        if (!navigator.geolocation){ info.textContent = 'この端末では現在地が使えません。「地図で選ぶ」を使ってください。'; return; }
        info.textContent = '現在地を調べています…'; Object.assign(place, {lat: null, lng: null, near: null});
        const seq = place.seq;
        navigator.geolocation.getCurrentPosition(pos => { if (seq === place.seq) resolvePlace(+pos.coords.latitude.toFixed(5), +pos.coords.longitude.toFixed(5)); },
          () => { if (seq === place.seq) info.textContent = '現在地を取得できませんでした。「地図で選ぶ」を使ってください。'; },
          {timeout: 15000, enableHighAccuracy: true});
      }
      if (mode === 'map'){
        if (!window.L){ info.textContent = '地図を読み込めませんでした。'; return; }
        const start = place.lat != null ? [place.lat, place.lng] : spotById(c.spotId) ? [spotById(c.spotId).lat, spotById(c.spotId).lng] : [currentPlace().lat, currentPlace().lng];
        if (!miniMap){
          miniMap = L.map(b.querySelector('#cf-map')).setView(start, 14);
          L.tileLayer(TILE.pale, {maxZoom: 19, maxNativeZoom: 18, attribution: GSI, className: 'tiles-pale'}).addTo(miniMap);
          let t; miniMap.on('moveend', () => { clearTimeout(t); t = setTimeout(() => { if (place.mode === 'map'){ const m = miniMap.getCenter(); resolvePlace(+m.lat.toFixed(5), +m.lng.toFixed(5)); } }, 500); });
        }
        setTimeout(() => { miniMap.invalidateSize(); const m = miniMap.getCenter(); resolvePlace(+m.lat.toFixed(5), +m.lng.toFixed(5)); }, 60);
      }
    }
    b.querySelectorAll('#cf-where button').forEach(x => x.addEventListener('click', () => setWhere(x.dataset.w)));
    setWhere(isNew ? 'here' : 'list');   // 新しい記録は「今いる場所」から、直す時は今の釣り場のまま

    b.querySelector('#cf').addEventListener('submit', async e => {
      e.preventDefault();
      const fishes = [...rowsBox.querySelectorAll('.fish-row')].map(r => ({
        fish: r.querySelector('.fr-fish').value.trim(),
        size: r.querySelector('.fr-size').value === '' ? null : +r.querySelector('.fr-size').value,
        count: Math.max(1, +r.querySelector('.fr-count').value || 1),
      })).filter(f => f.fish);
      if (!fishes.length) return toast('魚の種類を入れてください');
      if (place.mode !== 'list' && place.lat == null) return toast('場所がまだ決まっていません。「地図で選ぶ」か「登録済み」を選んでください');
      const btn = e.target.querySelector('[type=submit]');
      if (btn.disabled) return;                               // 2回押しで釣り場が2つできないように
      btn.disabled = true; btn.textContent = '保存中…';
      // 釣った場所を決める（新しい場所なら、ここで釣り場として登録する）
      let spotId = '', spotName = '';
      if (place.mode === 'list'){ spotId = sel.value; spotName = spotById(spotId)?.name || ''; }
      else if (place.near){ spotId = place.near.id; spotName = place.near.name; }
      else {
        const s = {id: uid(), name: nameIn.value.trim() || '名前のない釣り場', memo: '', lat: place.lat, lng: place.lng};
        await S.saveSpot(s); spotId = s.id; spotName = s.name;
      }
      // 写真：× の印を付けたものを消し、新しく選んだものを足す（合わせて5枚まで）
      const removeIds = [...b.querySelectorAll('#cf-photos .ph[aria-pressed="true"]')].map(x => x.dataset.pid);
      const add = [];
      for (const f of b.querySelector('#cf-photo').files){ try { add.push(await makePhoto(f)); } catch { toast('読み込めない写真がありました'); } }
      if (photosOf(c).length - removeIds.length + add.length > MAX_PHOTOS) toast(`写真は${MAX_PHOTOS}枚までです。はじめの${MAX_PHOTOS}枚を保存します`);
      const at = b.querySelector('#cf-at').value;
      const rec = {
        ...c, id: c.id || uid(), at, spotId, spotName,
        fishes,
        method: b.querySelector('#cf-method').value.trim(),
        memo: b.querySelector('#cf-memo').value.trim(),
        tide: tideInfo(at).name,
      };
      delete rec.fish; delete rec.size; delete rec.count;   // 前の形式の項目は消す
      try { await saveCatchWithPhotos(rec, add, removeIds); } catch { btn.disabled = false; btn.textContent = '保存する'; return toast('保存できませんでした'); }
      closeSheet(); toast(isNew ? '記録しました' : '直しました');
    });
  });
}
$('#add-catch').addEventListener('click', () => catchForm());

function catchDetail(id){
  const c = catches.find(x => x.id === id); if (!c) return;
  const fishList = fishesOf(c).map(f => `<div>${esc(f.fish)}${f.size != null ? ` <span class="num">${esc(f.size)}cm</span>` : ''}${(f.count || 1) > 1 ? ` <span class="num muted">×${f.count}</span>` : ''}</div>`).join('');
  openSheet(`${sheetHead(fishSummary(c))}
    ${photosOf(c).length ? `<img class="photo-big" id="cd-photo" src="${esc(photosOf(c)[0].thumb)}" alt="">` : ''}
    ${photosOf(c).length > 1 ? `<div class="photo-strip" id="cd-strip">${photosOf(c).map((p, i) => `<button type="button" class="ph" data-pid="${esc(p.id)}" aria-pressed="${i === 0}"><img src="${esc(p.thumb)}" alt="写真${i + 1}"></button>`).join('')}</div>` : ''}
    <dl class="dl">
      <dt>日時</dt><dd class="num">${fmtDate(c.at)} ${esc(c.at.slice(11,16))}</dd>
      <dt>釣れた魚</dt><dd>${fishList}<div class="small muted num">合計 ${countOf(c)}匹</div></dd>
      <dt>釣り場</dt><dd>${esc(spotById(c.spotId)?.name || c.spotName || '—')}</dd>
      <dt>潮回り</dt><dd><span class="chip">${esc(c.tide)}</span></dd>
      <dt>釣り方</dt><dd>${esc(c.method || '—')}</dd>
      <dt>メモ</dt><dd style="white-space:pre-wrap">${esc(c.memo || '—')}</dd>
    </dl>
    <div class="grid2"><button class="btn" id="cd-edit" type="button">直す</button><button class="btn danger" id="cd-del" type="button">削除</button></div>`, b => {
    // まず小さい写真を出し、大きい写真が届いたら差し替える
    const showPhoto = pid => {
      const p = photosOf(c).find(x => x.id === pid), img = b.querySelector('#cd-photo'); if (!p || !img) return;
      img.src = p.thumb; img.dataset.pid = pid;
      b.querySelectorAll('#cd-strip .ph').forEach(x => x.setAttribute('aria-pressed', x.dataset.pid === pid));
      S.getPhoto(pid).then(u => { if (u && u.startsWith('data:image/') && img.dataset.pid === pid) img.src = u; });
    };
    if (photosOf(c).length) showPhoto(photosOf(c)[0].id);
    b.querySelectorAll('#cd-strip .ph').forEach(x => x.onclick = () => showPhoto(x.dataset.pid));
    b.querySelector('#cd-edit').onclick = () => catchForm(c);
    const del = b.querySelector('#cd-del');
    del.onclick = async () => {
      if (!del.dataset.sure){ del.dataset.sure = 1; del.textContent = 'もう一度押すと削除'; return; }
      await S.deleteCatch(c.id); closeSheet(); toast('削除しました');
    };
  });
}

function renderLog(){
  const q = $('#log-q').value.trim();
  const list = catches.filter(c => !q || (fishesOf(c).map(f => f.fish).join(' ') + (spotById(c.spotId)?.name || c.spotName || '')).includes(q)).sort((a,b) => b.at.localeCompare(a.at));
  const box = $('#log-list');
  if (!catches.length){
    box.innerHTML = `<div class="card empty"><h3>まだ釣果がありません</h3><p style="margin:0">上の「釣果を記録する」から、釣れた魚を登録しましょう。写真も残せます。</p></div>`; return;
  }
  if (!list.length){ box.innerHTML = `<div class="card empty">「${esc(q)}」に当てはまる記録はありません。</div>`; return; }
  let html = '', lastMonth = '';
  for (const c of list){
    const mo = c.at.slice(0,7);
    if (mo !== lastMonth){ html += `<div class="month-h">${+mo.slice(0,4)}年${+mo.slice(5)}月</div>`; lastMonth = mo; }
    html += `<button class="catch" type="button" data-id="${esc(c.id)}">
      ${c.thumb ? `<img class="thumb" src="${esc(c.thumb)}" alt="">` : `<span class="thumb">${esc(fishesOf(c)[0].fish.slice(0,1))}</span>`}
      <span class="info">
        <span class="fish">${esc(fishSummary(c))}</span>
        ${maxSizeOf(c) != null ? `<span class="meta num">最大 ${esc(maxSizeOf(c))}cm${countOf(c) > 1 ? `・合計 ${countOf(c)}匹` : ''}</span>` : countOf(c) > 1 ? `<span class="meta num">合計 ${countOf(c)}匹</span>` : ''}
        <span class="meta num">${fmtDate(c.at)} ${esc(c.at.slice(11,16))}　<span class="chip">${esc(c.tide)}</span></span>
        <span class="meta">${esc(spotById(c.spotId)?.name || c.spotName || '場所なし')}${c.method ? '・' + esc(c.method) : ''}</span>
      </span></button>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('.catch').forEach(el => el.onclick = () => catchDetail(el.dataset.id));
}
$('#log-q').addEventListener('input', renderLog);

/* ログイン前にこのスマホへ保存していた記録を、アカウントに移す */
let pendingLocal = null;
async function checkMigration(){
  pendingLocal = null; $('#migrate-banner').hidden = true;
  try { const {cs, ss} = await localStore.load(); if (cs.length || ss.length) pendingLocal = {cs, ss}; } catch { return; }
  if (!pendingLocal) return;
  $('#migrate-text').textContent = `このスマホに、ログイン前に記録した釣果 ${pendingLocal.cs.length}件・釣り場 ${pendingLocal.ss.length}件があります。`;
  $('#migrate-banner').hidden = false;
}
$('#migrate-go').addEventListener('click', async () => {
  if (!pendingLocal || S.mode !== 'cloud') return;
  const btn = $('#migrate-go'); btn.disabled = true; btn.textContent = '移しています…';
  for (const s of pendingLocal.ss) await S.saveSpot(s);
  for (const c of pendingLocal.cs){
    const add = [];
    for (const p of photosOf(c)){ const full = await localStore.getPhoto(p.id); if (full) add.push({full, thumb: p.thumb}); }
    await saveCatchWithPhotos({...c, photos: [], thumb: null, hasPhoto: false}, add);
  }
  await localStore.clearAll(); pendingLocal = null;
  $('#migrate-banner').hidden = true; btn.disabled = false; btn.textContent = 'アカウントに移す';
  toast('アカウントに移しました');
});

/* =========================================================
   7. 釣り場マップ（国土地理院の地図）
   ・「すっきり」＝淡色地図（余計な色が少なく、海と陸の境目が見やすい）
   ・「詳しい地図」＝標準地図　・「航空写真」＝堤防や磯の形がそのまま見える
   ・釣り場は「十字を合わせて登録」方式（地図を動かしただけで登録画面が出ないように）
   ========================================================= */
const GSI = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>';
const TILE = {
  pale:  'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
  std:   'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
  photo: 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
};
let markerLayer, baseLayer, hereMarker, adding = false;
function setLayer(name){
  if (!TILE[name]) name = 'pale';
  if (baseLayer) map.removeLayer(baseLayer);
  baseLayer = L.tileLayer(TILE[name], {maxZoom: 19, maxNativeZoom: 18, attribution: GSI, className: 'tiles-' + name}).addTo(map);
  document.querySelectorAll('#map-layers button').forEach(b => b.setAttribute('aria-pressed', b.dataset.layer === name));
  lsSet('mapLayer', name);
}
function fitAll(){
  if (!spots.length) return map.setView([DEFAULT_PLACE.lat, DEFAULT_PLACE.lng], 11);
  map.fitBounds(L.latLngBounds(spots.map(s => [s.lat, s.lng])), {padding: [50, 50], maxZoom: 15});
}
function renderMap(){
  if (!window.L){ $('#map').innerHTML = '<div class="empty">地図を読み込めませんでした。電波の良い所で開き直してください。</div>'; renderSpotList(); return; }
  if (!map){
    map = L.map('map', {zoomControl: true});
    setLayer(lsGet('mapLayer') || 'pale');
    markerLayer = L.layerGroup().addTo(map);
    fitAll();
  }
  setTimeout(() => map.invalidateSize(), 50);
  markerLayer.clearLayers();
  for (const s of spots){
    const icon = L.divIcon({className: '', html: `<div class="pin"><div class="bobber"></div><span class="pin-label">${esc(s.name)}</span></div>`, iconSize: [30,30], iconAnchor: [15,15]});
    L.marker([s.lat, s.lng], {icon, title: s.name}).addTo(markerLayer).on('click', () => { if (!adding) spotDetail(s.id); });
  }
  renderSpotList();
}
document.querySelectorAll('#map-layers button').forEach(b => b.addEventListener('click', () => setLayer(b.dataset.layer)));
$('#m-all').addEventListener('click', fitAll);
$('#m-here').addEventListener('click', () => {
  if (!navigator.geolocation) return toast('この端末では現在地が使えません');
  toast('現在地を調べています…');
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (hereMarker) hereMarker.remove();
    hereMarker = L.marker(ll, {icon: L.divIcon({className: '', html: '<div class="here-dot"></div>', iconSize: [18,18], iconAnchor: [9,9]}), interactive: false}).addTo(map);
    map.setView(ll, 15);
  }, () => toast('現在地を取得できませんでした（位置情報の許可を確認してください）'), {timeout: 10000, enableHighAccuracy: true});
});
// 地名検索（国土地理院の地名検索サービス）
$('#map-search').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('#map-q').value.trim(), box = $('#map-results'); if (!q) return;
  box.hidden = false; box.innerHTML = '<div class="card muted">探しています…</div>';
  try {
    const r = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q));
    const items = (await r.json()).slice(0, 8);

    box.innerHTML = items.map((it, i) => `<button class="spot" type="button" data-i="${i}"><span>${esc(it.properties.title)}</span><span class="small muted">移動</span></button>`).join('')
      + '<button class="linkbtn" type="button" id="map-results-close">閉じる</button>';
    box.querySelectorAll('.spot').forEach(el => el.onclick = () => {
      const [lng, lat] = items[+el.dataset.i].geometry.coordinates; map.setView([lat, lng], 15);
      box.hidden = true; $('.map-wrap').scrollIntoView({block: 'start'});
    });
    $('#map-results-close').onclick = () => box.hidden = true;
  } catch { box.innerHTML = '<div class="card muted">検索できませんでした。電波の良い所でお試しください。</div>'; }
});
// 釣り場の追加：十字を出して、地図を動かして位置を合わせてもらう
function setAdding(on){
  adding = on;
  $('#crosshair').hidden = !on; $('#add-bar').hidden = !on; $('#add-spot').hidden = on;
  if (on){ $('.map-wrap').scrollIntoView({block: 'start', behavior: 'smooth'}); toast('地図を動かして十字を合わせてください'); }
}
$('#add-spot').addEventListener('click', () => setAdding(true));
$('#add-cancel').addEventListener('click', () => setAdding(false));
$('#add-here').addEventListener('click', () => { const c = map.getCenter(); setAdding(false); spotForm({lat: +c.lat.toFixed(5), lng: +c.lng.toFixed(5)}); });

function spotStats(id){ const cs = catches.filter(c => c.spotId === id); return {n: cs.reduce((a,c) => a + countOf(c), 0), days: new Set(cs.map(c => c.at.slice(0,10))).size}; }
/* ---- 現在地から各釣り場まで、車で何分か ----
   OSRM（OpenStreetMap の道路データで道順を計算する無料サービス）に、現在地と全部の釣り場を一度に渡して計算する。
   渋滞は含まない目安。使えない時は「直線距離×1.3 を時速35kmで走る」ざっくり計算に切り替える。 */
const travel = {from: null, at: 0, bySpot: {}, rough: false, busy: false};
const fmtMin = m => m < 60 ? `約${Math.max(1, Math.round(m))}分` : `約${Math.floor(m / 60)}時間${Math.round(m % 60) ? Math.round(m % 60) + '分' : ''}`;
const travelText = id => { const t = travel.bySpot[id]; return t ? `車で${fmtMin(t.min)}・${t.km < 10 ? t.km.toFixed(1) : Math.round(t.km)}km` : ''; };
function getHere(){
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('nogeo'));
    navigator.geolocation.getCurrentPosition(p => res({lat: p.coords.latitude, lng: p.coords.longitude}), rej, {timeout: 15000, maximumAge: 5 * 60e3});
  });
}
async function computeTravel(){
  if (travel.busy || !spots.length) return;
  travel.busy = true; renderSpotList();
  try {
    const from = await getHere();
    const list = spots.slice(0, 99);   // 1回で計算できる数の上限に合わせる
    let rough = false, bySpot = {};
    try {
      const coords = [from, ...list].map(p => `${p.lng.toFixed(5)},${p.lat.toFixed(5)}`).join(';');
      const r = await fetch(`https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=duration,distance`);
      const j = await r.json(); if (j.code !== 'Ok') throw 0;
      list.forEach((s, i) => { const sec = j.durations[0][i+1], m = j.distances[0][i+1]; if (sec != null) bySpot[s.id] = {min: sec / 60, km: m / 1000}; });
    } catch {
      rough = true;
      list.forEach(s => { const km = distKm(from, s) * 1.3; bySpot[s.id] = {min: km / 35 * 60, km}; });
    }
    Object.assign(travel, {from, at: Date.now(), bySpot, rough});
  } catch { toast('現在地を取得できませんでした（位置情報の許可を確認してください）'); }
  travel.busy = false; renderSpotList();
}
// すでに位置情報を許可している時は、釣り場タブを開いた時に自動で計算する
async function autoTravel(){
  if (travel.at && Date.now() - travel.at < 10 * 60e3) return;
  try { const p = await navigator.permissions?.query({name: 'geolocation'}); if (p?.state === 'granted') computeTravel(); } catch {}
}

/* 釣れる魚カレンダー：自分で入れた「釣れる時期」（薄い色）と、実際に自分が釣った月（濃い色＋匹数）を重ねて表示 */
function seasonCalendar(s, cs){
  const rows = new Map();   // 魚 → {exp:Set(月), hit:{月:匹数}, total}
  const get = f => { if (!rows.has(f)) rows.set(f, {exp: new Set(), hit: {}, total: 0}); return rows.get(f); };
  for (const r of s.season || []) r.months.forEach(m => get(r.fish).exp.add(m));
  for (const f of fishRows(cs)){ const m = +f.c.at.slice(5,7), r = get(f.fish); r.hit[m] = (r.hit[m] || 0) + f.count; r.total += f.count; }
  if (!rows.size) return '';
  const now = new Date().getMonth() + 1;
  const sorted = [...rows].sort((a, b) => b[1].total - a[1].total || b[1].exp.size - a[1].exp.size);
  return `<div class="cal-wrap"><table class="cal">
    <thead><tr><th></th>${Array.from({length: 12}, (_, i) => `<th class="${i+1 === now ? 'now' : ''}">${i+1}</th>`).join('')}</tr></thead>
    <tbody>${sorted.map(([fish, r]) => `<tr><th>${esc(fish)}</th>${Array.from({length: 12}, (_, i) => {
      const m = i + 1, n = r.hit[m];
      const cls = [n ? 'hit' : r.exp.has(m) ? 'exp' : '', m === now ? 'now' : ''].join(' ').trim();
      return `<td class="${cls}">${n || ''}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="small muted" style="margin:6px 0 0"><span class="lg lg-hit"></span>自分が釣った月（数字は匹数）　<span class="lg lg-exp"></span>釣れる時期の目安</p>`;
}

/* =========================================================
   8. 成績（集計）
   ========================================================= */
function bars(entries, fmt){
  const max = Math.max(...entries.map(e => e[1]), 1);
  return `<div class="bars">${entries.map(([k,v,sub]) => `<div class="bar"><span class="bar-k">${esc(k)}</span><span class="bar-track"><span class="bar-fill" style="width:${(v/max*100).toFixed(1)}%"></span></span><span class="bar-v">${fmt(v, sub)}</span></div>`).join('')}</div>`;
}
function renderStats(){
  renderAccount();
  const box = $('#stats-body');
  if (!catches.length){ box.innerHTML = `<div class="card empty"><h3>まだ集計する記録がありません</h3><p style="margin:0">釣果を記録すると、ここに魚の種類別・潮回り別の成績が出ます。</p></div>`; return; }
  const rows = fishRows(catches);   // 魚1行ずつ（1件の記録に複数の魚があっても正しく数える）
  const total = rows.reduce((a,f) => a + f.count, 0);
  const days = new Set(catches.map(c => c.at.slice(0,10)));
  const biggest = rows.filter(f => f.size != null).sort((a,b) => b.size - a.size)[0];

  const byFish = {}; rows.forEach(f => byFish[f.fish] = (byFish[f.fish] || 0) + f.count);
  const fishE = Object.entries(byFish).sort((a,b) => b[1]-a[1]).slice(0,8);

  // 潮回り別：1回の釣行あたり何匹釣れたか（平均）
  const tideN = {}, tideD = {};
  catches.forEach(c => { tideN[c.tide] = (tideN[c.tide] || 0) + countOf(c); (tideD[c.tide] ||= new Set()).add(c.at.slice(0,10)); });
  const tideE = TIDE_ORDER.filter(t => tideD[t]).map(t => [t, tideN[t] / tideD[t].size, tideD[t].size]);

  // 月別（直近12か月）
  const monthE = [];
  for (let i = 11; i >= 0; i--){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); const k = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; monthE.push([`${d.getMonth()+1}月`, catches.filter(c => c.at.startsWith(k)).reduce((a,c) => a + countOf(c), 0)]); }

  // 魚種ごとの最大サイズ
  const best = {}; rows.forEach(f => { if (f.size != null && (!best[f.fish] || f.size > best[f.fish].size)) best[f.fish] = f; });
  const bestRows = Object.values(best).sort((a,b) => b.size - a.size).slice(0,8)
    .map(f => `<div class="bar" style="grid-template-columns:6.5em 1fr auto"><span class="bar-k">${esc(f.fish)}</span><span class="small muted num">${fmtDate(f.c.at)}・${esc(spotById(f.c.spotId)?.name || f.c.spotName || '')}</span><span class="bar-v">${esc(f.size)}cm</span></div>`).join('');

  box.innerHTML = `
    <div class="tiles">
      <div class="tile"><span class="label">釣行</span><b>${days.size}<span class="small">回</span></b><small>記録した日数</small></div>
      <div class="tile"><span class="label">合計</span><b>${total}<span class="small">匹</span></b><small>${Object.keys(byFish).length}種類</small></div>
      <div class="tile"><span class="label">最大</span><b>${biggest ? esc(biggest.size) + '<span class="small">cm</span>' : '—'}</b><small>${biggest ? esc(biggest.fish) : ''}</small></div>
    </div>
    <div class="card"><h2>よく釣れた魚</h2>${bars(fishE, v => v + '匹')}</div>
    <div class="card"><h2>潮回り別の釣れ具合</h2><p class="small muted" style="margin:-4px 0 10px">1回の釣行で平均何匹釣れたか。釣行回数が少ない潮は参考程度に。</p>${bars(tideE, (v, d) => `${v.toFixed(1)}匹<span class="small muted">（${d}回）</span>`)}</div>
    <div class="card"><h2>月ごとの匹数</h2>${bars(monthE, v => v + '匹')}</div>
    ${bestRows ? `<div class="card"><h2>魚ごとの自己ベスト</h2><div class="bars">${bestRows}</div></div>` : ''}`;
}

      </form>`,
    signup: `<form id="af" class="card view" style="gap:12px">
        <label class="field"><span>お名前（アプリの中で表示されます）</span><input id="a-name" autocomplete="nickname" required placeholder="例：とうちゃん"></label>
        <label class="field"><span>メールアドレス</span><input id="a-email" type="email" autocomplete="email" required></label>
        <label class="field"><span>パスワード（6文字以上）</span><input id="a-pass" type="password" autocomplete="new-password" minlength="6" required></label>
        <label class="field"><span>パスワード（確認のためもう一度）</span><input id="a-pass2" type="password" autocomplete="new-password" minlength="6" required></label>
        <p class="err" id="a-err" hidden></p>
        <button class="btn primary block" type="submit">登録してはじめる</button>
      </form>`,
    reset: `<form id="af" class="card view" style="gap:12px">
        <p style="margin:0">登録したメールアドレスに、パスワードを決め直すためのメールを送ります。</p>
        <label class="field"><span>メールアドレス</span><input id="a-email" type="email" autocomplete="email" required></label>
        <p class="err" id="a-err" hidden></p><p class="ok-msg" id="a-ok" hidden></p>
        <button class="btn primary block" type="submit">メールを送る</button>
        <button class="linkbtn" type="button" id="a-back">ログインに戻る</button>
      </form>`,
  };
  box.innerHTML = `<h2 style="font-size:1.4rem">${mode === 'signup' ? 'はじめての方' : mode === 'reset' ? 'パスワードの再設定' : 'おかえりなさい'}</h2>
    <p class="lead">記録はアカウントごとに保存されます。スマホを替えても、ログインすれば同じ記録が見られます。</p>
    ${mode === 'reset' ? '' : tabs}${forms[mode]}`;
  box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => renderAuth(b.dataset.m));
  box.querySelector('#a-forgot')?.addEventListener('click', () => renderAuth('reset'));
  box.querySelector('#a-back')?.addEventListener('click', () => renderAuth('login'));
  const err = box.querySelector('#a-err'), showErr = m => { err.textContent = m; err.hidden = !m; };
  box.querySelector('#af').addEventListener('submit', async e => {
    e.preventDefault(); showErr('');
    const btn = e.target.querySelector('[type=submit]'), label = btn.textContent;
    const email = box.querySelector('#a-email').value.trim(), pass = box.querySelector('#a-pass')?.value;
    if (mode === 'signup' && pass !== box.querySelector('#a-pass2').value) return showErr('確認用のパスワードが一致しません。');
    btn.disabled = true; btn.textContent = 'お待ちください…';
    try {
      if (mode === 'login') await fb.A.signInWithEmailAndPassword(fb.auth, email, pass);
      if (mode === 'signup'){
        const cred = await fb.A.createUserWithEmailAndPassword(fb.auth, email, pass);
        await fb.A.updateProfile(cred.user, {displayName: box.querySelector('#a-name').value.trim()});
        renderAccount();
      }
      if (mode === 'reset'){
        await fb.A.sendPasswordResetEmail(fb.auth, email);
        const ok = box.querySelector('#a-ok'); ok.textContent = 'メールを送りました。届かないときは迷惑メールのフォルダも見てください。'; ok.hidden = false;
      }
    } catch (ex) { showErr(authMsg(ex)); }
    btn.disabled = false; btn.textContent = label;
  });
}
function signedIn(){
  document.body.classList.remove('signed-out'); $('#auth').hidden = true;
  listenCloud(); showTab(currentTab || 'umi'); checkMigration();
}
function signedOut(){
  unsubs.forEach(u => u()); unsubs = []; catches = []; spots = [];
  document.body.classList.add('signed-out'); $('#auth').hidden = false;
  renderAuth('login'); window.scrollTo(0, 0);
}

/* =========================================================
   10.5 アプリとしてホーム画面に置く（PWA）
   ・サービスワーカーを登録：アプリ本体をスマホに保存し、電波が弱くても開けるように
   ・ブラウザで開いている時だけ「ホーム画面に追加」の案内を出す（閉じたら次からは出さない）
   ========================================================= */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(function installHint(){
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (standalone || lsGet('installHintClosed')) return;
  const box = $('#install-hint');
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  $('#ih-close').onclick = () => { box.hidden = true; lsSet('installHintClosed', '1'); };
  if (isIOS){ $('#ih-ios').hidden = false; box.hidden = false; return; }
  // Android の Chrome など：ボタン一つで追加できる
  let deferred;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    $('#ih-android').hidden = false; $('#ih-install').hidden = false; box.hidden = false;
  });
  $('#ih-install').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; box.hidden = true; };
  window.addEventListener('appinstalled', () => { box.hidden = true; });
})();

/* =========================================================
   11. 起動
   ========================================================= */
(async function start(){
  const d = new Date(); $('#today').textContent = `${d.getMonth()+1}月${d.getDate()}日 ${tideInfo(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`).name}`;
  if (FIREBASE_CONFIG){
    // ログイン機能あり：ログイン状態が分かるまでは何も出さない
    document.body.classList.add('signed-out');
    try { await initFirebase(); }
    catch { $('#auth').hidden = false; $('#auth').innerHTML = '<div class="card">ログイン機能を読み込めませんでした。電波の良い所で開き直してください。</div>'; return; }
    S = cloudStore;
    fb.A.onAuthStateChanged(fb.auth, u => { user = u; u ? signedIn() : signedOut(); });
  } else {
    // ログイン機能なし：このスマホの中に保存
    S = localStore;
    try { await reloadLocal(); }
    catch { toast('このブラウザでは記録を保存できません（プライベートモードを解除してください）'); }
    showTab('umi');
  }
})();
</script>
